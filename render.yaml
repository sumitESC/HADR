services:
  - type: web
    name: hadr-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-max-requests 1000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MALLOC_ARENA_MAX
        value: 2

  - type: web
    name: hadr-frontend
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npx serve -s dist -l $PORT"
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: VITE_API_BASE_URL
        value: "https://hadr-backend.onrender.com/api" # Note: Update this if the backend gets a different URL on Render
